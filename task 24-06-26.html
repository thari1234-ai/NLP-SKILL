<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 24-06-26</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #f3f8ff;
      font-family: Arial, sans-serif;
    }
    .form-group {
      margin: 12px 0;
    }
    input {
      padding: 8px;
      font-size: 16px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    .message {
      margin-top: 10px;
      font-size: 15px;
    }
    .error {
      color: #c0392b;
    }
    .success {
      color: #27ae60;
    }
  </style>
</head>
<body>
  <h1>Task 24-06-26</h1>

  <h2>Button Event Listener &amp; Input Validation</h2>

  <div class="form-group">
    <label for="nameInput">Enter your name:</label>
    <input type="text" id="nameInput" placeholder="Type something..." />
  </div>

  <button id="submitBtn">Submit</button>

  <p id="message" class="message"></p>

  <script>
    // 1. Add an event listener to a button
    const submitBtn = document.getElementById("submitBtn");
    const nameInput = document.getElementById("nameInput");
    const message = document.getElementById("message");

    submitBtn.addEventListener("click", function () {
      validateInput();
    });

    // 2. Validate a text input field
    function validateInput() {
      const value = nameInput.value.trim();

      if (value === "") {
        message.textContent = "Error: This field cannot be empty.";
        message.className = "message error";
        return;
      }

      if (value.length < 3) {
        message.textContent = "Error: Please enter at least 3 characters.";
        message.className = "message error";
        return;
      }

      if (!/^[A-Za-z\s]+$/.test(value)) {
        message.textContent = "Error: Only letters and spaces are allowed.";
        message.className = "message error";
        return;
      }

      message.textContent = "Success: Hello, " + value + "!";
      message.className = "message success";
    }
  </script>
</body>
</html>
